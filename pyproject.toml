[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "magnet-agents-for-humans"
version = "0.1.0"
description = "MAGNET — adoption log + eval runner for your agent stack"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Oscar Morkeeth"}]
dependencies = [
    "strands-agents>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
magnet = "magnet.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["magnet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: integration tests that spawn full judge-demo (excluded from pytest-pass-rate probe)",
]
